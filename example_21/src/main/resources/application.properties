# ===================================================
# Configuration de l'application Spring Boot
# Fichier : src/main/resources/application.properties
# ===================================================

# --- Datasource H2 (base de données en mémoire) ---
# jdbc:h2:mem:produitdb  → base créée en mémoire, nommée "produitdb"
# Les données sont perdues à chaque redémarrage (idéal pour les tests/démos)
spring.datasource.url=jdbc:h2:mem:produitdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# ddl-auto=create-drop : Hibernate crée les tables au démarrage
#                        et les supprime à l'arrêt.
# Autres valeurs utiles :
#   update  → met à jour le schéma sans supprimer les données
#   create  → recrée les tables à chaque démarrage (données perdues)
#   none    → Hibernate ne touche pas au schéma (à utiliser en production)
spring.jpa.hibernate.ddl-auto=create-drop

# Affiche les requêtes SQL générées par Hibernate dans la console (pour déboguer)
spring.jpa.show-sql=true

# Formatte le SQL affiché (plus lisible)
spring.jpa.properties.hibernate.format_sql=true

# --- Console H2 ---
# Active la console web H2, accessible à l'URL : http://localhost:8080/h2-console
# Utile pour inspecter les données directement dans le navigateur
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Serveur ---
# Port d'écoute de l'application (par défaut : 8080)
server.port=8080
